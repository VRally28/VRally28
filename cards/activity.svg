<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111A2E"/><stop offset="1" stop-color="#0B1020"/></linearGradient><linearGradient id="a"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient></defs><rect width="1200" height="230" rx="24" fill="url(#bg)" stroke="#263650"/><text x="38" y="48" fill="#38BDF8" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">CONTRIBUTION PULSE</text><text x="38" y="78" fill="#91A4BD" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" >A rolling 12-month snapshot from GitHub</text><text x="38" y="130" fill="#E5EEF9" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="750" >—</text><text x="38" y="153" fill="#91A4BD" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="650" letter-spacing="1">TOTAL CONTRIBUTIONS</text><text x="324" y="130" fill="#E5EEF9" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="750" >—</text><text x="324" y="153" fill="#91A4BD" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="650" letter-spacing="1">ACTIVE DAYS</text><text x="610" y="130" fill="#E5EEF9" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="750" >—</text><text x="610" y="153" fill="#91A4BD" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="650" letter-spacing="1">CURRENT STREAK</text><text x="896" y="130" fill="#E5EEF9" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="750" >—</text><text x="896" y="153" fill="#91A4BD" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="650" letter-spacing="1">LONGEST STREAK</text><text x="38" y="198" fill="#38BDF8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" >Contribution statistics will populate after the first workflow run.</text></svg>

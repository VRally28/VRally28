<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="326" viewBox="0 0 1200 326" role="img"><defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101A2B"/><stop offset="1" stop-color="#080D19"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#38BDF8"/><stop offset=".55" stop-color="#67E8F9"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient>
<linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#8B7CFF"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#38BDF8" stop-opacity=".24"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#A9C8F0" stroke-opacity=".055"/></pattern>
<style>
text{font-family:Inter,Arial,sans-serif}
.enter{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.glow{animation:breathe 5s ease-in-out infinite}
.dash{stroke-dasharray:900;stroke-dashoffset:900;animation:trace 1.7s ease forwards}
.bar{transform-box:fill-box;transform-origin:bottom;animation:barIn .8s ease both}
.heat{transform-box:fill-box;transform-origin:center;animation:heatIn .55s ease both}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes breathe{50%{opacity:.55;transform:scale(1.06)}}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes barIn{from{transform:scaleY(.05);opacity:.3}to{transform:scaleY(1);opacity:1}}
@keyframes heatIn{from{opacity:.15;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.enter,.glow,.dash,.bar,.heat{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}}
</style></defs><rect width="1200" height="326" rx="26" fill="url(#surface)" stroke="#263B58"/><rect width="1200" height="326" rx="26" fill="url(#grid)"/><text x="36" y="43" font-family="Inter,Arial,sans-serif" font-size="11" fill="#38BDF8" font-weight="800" letter-spacing="2.4">GITHUB / ACTIVITY</text><text x="36" y="76" font-family="Inter,Arial,sans-serif" font-size="27" fill="#F3F7FF" font-weight="750" letter-spacing="-.5">Consistency, in motion.</text><text x="36" y="99" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9AAEC8" font-weight="500" >A rolling 12-month view of public contributions.</text><g class="enter" style="animation-delay:0ms"><rect x="36" y="130" width="268" height="78" rx="15" fill="#111F34" stroke="#293F5D"/><text x="53" y="159" font-family="Inter,Arial,sans-serif" font-size="9" fill="#60748F" font-weight="750" letter-spacing="1.1">TOTAL CONTRIBUTIONS</text><text x="53" y="189" font-family="Inter,Arial,sans-serif" font-size="24" fill="#F3F7FF" font-weight="800" >—</text><text x="285" y="188" font-family="Inter,Arial,sans-serif" font-size="8" fill="#9AAEC8" font-weight="600" text-anchor="end">LAST 12 MONTHS</text></g><g class="enter" style="animation-delay:90ms"><rect x="322" y="130" width="268" height="78" rx="15" fill="#111F34" stroke="#293F5D"/><text x="339" y="159" font-family="Inter,Arial,sans-serif" font-size="9" fill="#60748F" font-weight="750" letter-spacing="1.1">ACTIVE DAYS</text><text x="339" y="189" font-family="Inter,Arial,sans-serif" font-size="24" fill="#F3F7FF" font-weight="800" >—</text><text x="571" y="188" font-family="Inter,Arial,sans-serif" font-size="8" fill="#9AAEC8" font-weight="600" text-anchor="end">DAYS WITH ACTIVITY</text></g><g class="enter" style="animation-delay:180ms"><rect x="36" y="222" width="268" height="78" rx="15" fill="#111F34" stroke="#293F5D"/><text x="53" y="251" font-family="Inter,Arial,sans-serif" font-size="9" fill="#60748F" font-weight="750" letter-spacing="1.1">CURRENT STREAK</text><text x="53" y="281" font-family="Inter,Arial,sans-serif" font-size="24" fill="#F3F7FF" font-weight="800" >—</text><text x="285" y="280" font-family="Inter,Arial,sans-serif" font-size="8" fill="#9AAEC8" font-weight="600" text-anchor="end">CONSECUTIVE DAYS</text></g><g class="enter" style="animation-delay:270ms"><rect x="322" y="222" width="268" height="78" rx="15" fill="#111F34" stroke="#293F5D"/><text x="339" y="251" font-family="Inter,Arial,sans-serif" font-size="9" fill="#60748F" font-weight="750" letter-spacing="1.1">LONGEST STREAK</text><text x="339" y="281" font-family="Inter,Arial,sans-serif" font-size="24" fill="#F3F7FF" font-weight="800" >—</text><text x="571" y="280" font-family="Inter,Arial,sans-serif" font-size="8" fill="#9AAEC8" font-weight="600" text-anchor="end">IN THIS 12-MONTH WINDOW</text></g><rect x="620" y="115" width="544" height="185" rx="18" fill="#0D1728" stroke="#293F5D"/><text x="646" y="144" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9AAEC8" font-weight="750" letter-spacing="1.6">MONTHLY CONTRIBUTIONS</text><text x="892" y="210" font-family="Inter,Arial,sans-serif" font-size="12" fill="#60748F" font-weight="750" text-anchor="middle" letter-spacing="1.6">AWAITING FIRST DATA SYNC</text><rect x="650" y="176" width="22" height="72" rx="6" fill="#17263B"/><rect x="691" y="176" width="22" height="72" rx="6" fill="#17263B"/><rect x="732" y="176" width="22" height="72" rx="6" fill="#17263B"/><rect x="773" y="176" width="22" height="72" rx="6" fill="#17263B"/><rect x="814" y="176" width="22" height="72" rx="6" fill="#17263B"/><rect x="855" y="176" width="22" height="72" rx="6" fill="#17263B"/><rect x="896" y="176" width="22" height="72" rx="6" fill="#17263B"/><rect x="937" y="176" width="22" height="72" rx="6" fill="#17263B"/><rect x="978" y="176" width="22" height="72" rx="6" fill="#17263B"/><rect x="1019" y="176" width="22" height="72" rx="6" fill="#17263B"/><rect x="1060" y="176" width="22" height="72" rx="6" fill="#17263B"/><rect x="1101" y="176" width="22" height="72" rx="6" fill="#17263B"/><text x="646" y="291" font-family="Inter,Arial,sans-serif" font-size="10" fill="#38BDF8" font-weight="600" >Busiest day: data pending</text></svg>

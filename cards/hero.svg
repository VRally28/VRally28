<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="356" viewBox="0 0 1200 356" role="img"><defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101A2B"/><stop offset="1" stop-color="#080D19"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#38BDF8"/><stop offset=".55" stop-color="#67E8F9"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient>
<linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#8B7CFF"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#38BDF8" stop-opacity=".24"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#A9C8F0" stroke-opacity=".055"/></pattern>
<style>
text{font-family:Inter,Arial,sans-serif}
.enter{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.glow{animation:breathe 5s ease-in-out infinite}
.dash{stroke-dasharray:900;stroke-dashoffset:900;animation:trace 1.7s ease forwards}
.bar{transform-box:fill-box;transform-origin:bottom;animation:barIn .8s ease both}
.heat{transform-box:fill-box;transform-origin:center;animation:heatIn .55s ease both}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes breathe{50%{opacity:.55;transform:scale(1.06)}}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes barIn{from{transform:scaleY(.05);opacity:.3}to{transform:scaleY(1);opacity:1}}
@keyframes heatIn{from{opacity:.15;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.enter,.glow,.dash,.bar,.heat{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}}
</style></defs><rect width="1200" height="356" rx="26" fill="url(#surface)" stroke="#263B58"/><rect width="1200" height="356" rx="26" fill="url(#grid)"/><circle cx="1040" cy="65" r="250" fill="url(#halo)" class="glow"/><circle cx="1040" cy="65" r="168" fill="none" stroke="#38BDF8" stroke-opacity=".13"/><circle cx="1040" cy="65" r="124" fill="none" stroke="#8B7CFF" stroke-opacity=".16" stroke-dasharray="4 9"/><path d="M0 300 C250 230 390 390 670 292 S1040 260 1200 305" fill="none" stroke="url(#edge)" stroke-opacity=".17" stroke-width="2"/><g class="enter"><rect x="54" y="66" width="224" height="224" rx="34" fill="#0B1425" stroke="#294666" stroke-width="1.5"/><rect x="65" y="77" width="202" height="202" rx="27" fill="none" stroke="url(#edge)" stroke-opacity=".55"/><circle cx="166" cy="178" r="72" fill="#12243B" stroke="#315578"/><circle cx="166" cy="178" r="87" fill="none" stroke="#38BDF8" stroke-opacity=".35" stroke-dasharray="2 8"/><text x="166" y="196" font-family="Inter,Arial,sans-serif" font-size="62" fill="#F3F7FF" font-weight="800" text-anchor="middle" letter-spacing="-4">VR</text><circle cx="241" cy="112" r="5" fill="#67E8F9"/><circle cx="91" cy="239" r="3" fill="#8B7CFF"/></g><text x="326" y="91" font-family="Inter,Arial,sans-serif" font-size="13" fill="#38BDF8" font-weight="800" letter-spacing="3.5">VANSH RALLY</text><text x="326" y="151" font-family="Inter,Arial,sans-serif" font-size="48" fill="#F3F7FF" font-weight="800" letter-spacing="-1.8">I build things</text><text x="326" y="205" font-family="Inter,Arial,sans-serif" font-size="48" fill="#F3F7FF" font-weight="800" letter-spacing="-1.8">for the web.</text><text x="329" y="247" font-family="Inter,Arial,sans-serif" font-size="15" fill="#9AAEC8" font-weight="500" >Computer Science Student  /  Frontend Developer  /  Builder</text><rect x="328" y="273" width="112" height="30" rx="15" fill="#102C42" stroke="#24516C"/><text x="384" y="293" font-family="Inter,Arial,sans-serif" font-size="10" fill="#67E8F9" font-weight="750" text-anchor="middle" letter-spacing="1.2">REACT</text><rect x="449" y="273" width="130" height="30" rx="15" fill="#19233F" stroke="#3A3C70"/><text x="514" y="293" font-family="Inter,Arial,sans-serif" font-size="10" fill="#B8B0FF" font-weight="750" text-anchor="middle" letter-spacing="1.2">JAVASCRIPT</text><rect x="588" y="273" width="105" height="30" rx="15" fill="#102C42" stroke="#24516C"/><text x="640.5" y="293" font-family="Inter,Arial,sans-serif" font-size="10" fill="#67E8F9" font-weight="750" text-anchor="middle" letter-spacing="1.2">PYTHON</text><rect x="702" y="273" width="150" height="30" rx="15" fill="#19233F" stroke="#3A3C70"/><text x="777" y="293" font-family="Inter,Arial,sans-serif" font-size="10" fill="#B8B0FF" font-weight="750" text-anchor="middle" letter-spacing="1.2">FULL-STACK</text><text x="1144" y="48" font-family="Inter,Arial,sans-serif" font-size="10" fill="#60748F" font-weight="700" text-anchor="end" letter-spacing="2">01 / PROFILE</text><path d="M328 326 H1144" stroke="url(#edge)" stroke-opacity=".7" stroke-width="2" class="dash"/><circle cx="1144" cy="326" r="4" fill="#67E8F9" class="glow"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle></svg>

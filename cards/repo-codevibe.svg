<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img"><defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101A2B"/><stop offset="1" stop-color="#080D19"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#38BDF8"/><stop offset=".55" stop-color="#67E8F9"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient>
<linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#8B7CFF"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#38BDF8" stop-opacity=".24"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#A9C8F0" stroke-opacity=".055"/></pattern>
<style>
text{font-family:Inter,Arial,sans-serif}
.enter{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.glow{animation:breathe 5s ease-in-out infinite}
.dash{stroke-dasharray:900;stroke-dashoffset:900;animation:trace 1.7s ease forwards}
.bar{transform-box:fill-box;transform-origin:bottom;animation:barIn .8s ease both}
.heat{transform-box:fill-box;transform-origin:center;animation:heatIn .55s ease both}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes breathe{50%{opacity:.55;transform:scale(1.06)}}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes barIn{from{transform:scaleY(.05);opacity:.3}to{transform:scaleY(1);opacity:1}}
@keyframes heatIn{from{opacity:.15;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.enter,.glow,.dash,.bar,.heat{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}}
</style></defs><rect width="1200" height="190" rx="26" fill="url(#surface)" stroke="#263B58"/><rect width="1200" height="190" rx="26" fill="url(#grid)"/><rect x="18" y="17" width="1164" height="156" rx="22" fill="#101C30" stroke="#2A405E"/><rect x="38" y="38" width="54" height="54" rx="15" fill="#152E49" stroke="#2F5578"/><text x="65" y="73" font-family="Inter,Arial,sans-serif" font-size="16" fill="#67E8F9" font-weight="800" text-anchor="middle">01</text><text x="118" y="57" font-family="Inter,Arial,sans-serif" font-size="9" fill="#38BDF8" font-weight="750" letter-spacing="1.7">SELECTED BUILD  /  01</text><text x="118" y="91" font-family="Inter,Arial,sans-serif" font-size="23" fill="#F3F7FF" font-weight="800" letter-spacing="-.4">CODEVIBE</text><text x="118" y="119" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9AAEC8" font-weight="500" >A browser-based coding practice platform.</text><rect x="118" y="137" width="300" height="22" rx="11" fill="#172943" stroke="#29445F"/><text x="268" y="152" font-family="Inter,Arial,sans-serif" font-size="9" fill="#67E8F9" font-weight="700" text-anchor="middle" letter-spacing=".5">HTML  /  CSS  /  JAVASCRIPT</text><rect x="790" y="32" width="354" height="126" rx="16" fill="#0A1424" stroke="#263F5D"/><circle cx="814" cy="53" r="4" fill="#F38BA8"/><circle cx="829" cy="53" r="4" fill="#F9E2AF"/><circle cx="844" cy="53" r="4" fill="#A6E3A1"/><text x="814" y="83" font-family="Inter,Arial,sans-serif" font-size="13" fill="#F3F7FF" font-weight="700" >$</text><text x="832" y="83" font-family="Inter,Arial,sans-serif" font-size="13" fill="#F3F7FF" font-weight="650" >learn();</text><text x="814" y="108" font-family="Inter,Arial,sans-serif" font-size="10" fill="#38BDF8" font-weight="600" >01  practice  →  build</text><path d="M814 126 H1050" stroke="#29445F"/><path d="M814 126 H946" stroke="url(#edge)" stroke-width="2"/><text x="1143" y="53" font-family="Inter,Arial,sans-serif" font-size="19" fill="#38BDF8" font-weight="700" text-anchor="middle">↗</text><path d="M38 171 H1160" stroke="url(#edge)" stroke-opacity=".45" stroke-width="1.5" class="dash"/></svg>

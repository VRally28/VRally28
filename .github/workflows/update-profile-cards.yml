name: Refresh profile visuals

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font subset tooling
        run: python -m pip install --upgrade fonttools brotli

      - name: Download and subset Inter
        run: |
          mkdir -p assets
          curl -L --fail --silent --show-error \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf" \
            -o /tmp/Inter.ttf
          python -m fontTools.subset /tmp/Inter.ttf \
            --output-file=assets/Inter-subset.woff2 \
            --flavor=woff2 \
            --unicodes="U+0020-007E,U+00B7,U+2022,U+2197,U+2192,U+25CE,U+2014"

      - name: Fetch contribution data and render SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: VRally28
        run: python scripts/generate_cards.py

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile visuals"
            git push
          fi
